<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Image Captioning System</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="card">
    <h1>Image Captioning System</h1>
    <p class="subtitle">Upload an image and let the model describe it.</p>

    <label class="dropzone" id="dropzone" for="file-input">
      <img id="preview" alt="" hidden />
      <span id="dropzone-text">Click to choose an image, or drag one here</span>
      <input type="file" id="file-input" accept="image/*" hidden />
    </label>

    <button id="generate-btn" disabled>Generate Caption</button>

    <div id="result" class="result" hidden>
      <h2>Caption</h2>
      <p id="caption-text"></p>
    </div>

    <div id="error" class="error" hidden></div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
